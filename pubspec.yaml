name: tokopulpen
description: Aplikasi e-commerce toko pulpen sederhana.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Letakkan gambar produk di sini, mis. assets/images/pen1.png ... pen6.png
  # Jika file belum ada, aplikasi otomatis menampilkan placeholder.
  assets:
    - assets/images/